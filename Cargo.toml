[package]
name = "escp-utility"
version = "0.1.0"
edition = "2024"
description = "Printing Preferences and maintenance (nozzle check, head cleaning, status) for Epson inkjet printers on Linux, laid out like the Windows driver"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
libc = "0.2"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "unstable-winit-030"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# Slint's text stack (fontique) links fontconfig through pkg-config by default.
# "fontconfig-dlopen" loads libfontconfig.so.1 at run time instead, so no -dev package is needed.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
strip = true
