[package]
name = "epson-l800-utility"
version = "0.1.0"
edition = "2024"
description = "Linux maintenance utility for the Epson L800, laid out like the Windows driver's Maintenance tab"
license = "MIT"
publish = false

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Slint's text stack (fontique) links fontconfig through pkg-config by default.
# "fontconfig-dlopen" loads libfontconfig.so.1 at run time instead, so no -dev package is needed.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
strip = true
